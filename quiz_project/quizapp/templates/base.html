<!DOCTYPE html>
<html>
<head>
    <title>QuizPro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        @keyframes gradientFlow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* Soft rotating glow layer */
body::before {
    content: "";
    position: fixed;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(
        circle at center,
        rgba(5, 50, 112, 0.15),
        transparent 60%
    );
    animation: rotateGlow 30s linear infinite;
    z-index: -1;
}

@keyframes rotateGlow {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}
:root {
    --bg-dark: #0f0f13;
    --card-dark: #18181f;
    --accent: #4F46E5;
    --text-light: #ffffff;
    --text-muted: #9ca3af;
}

body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    color: #f3f4f6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

    background: linear-gradient(
        -45deg,
        #0f172a,
        #111827,
        #1e1b4b,
        #0f172a
    );

    background-size: 400% 400%;
    animation: gradientFlow 18s ease infinite;
    overflow-x: hidden;
}

.navbar {
    background: #14141a;
    border-bottom: 1px solid #222;
}

.brand {
    font-weight: 600;
    font-size: 20px;
    color: var(--accent);
}

.card-modern {
    background: var(--card-dark);
    border-radius: 18px;
    padding: 35px;
    border: 1px solid #222;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    transition: 0.3s ease;
}

.card-modern:hover {
    transform: translateY(-4px);
}

.btn-modern {
    background: linear-gradient(135deg, #4F46E5, #6D5DF6);
    color: white;
    border-radius: 30px;
    padding: 10px 22px;
    border: none;
    transition: 0.2s ease;
}

.btn-modern:hover {
    transform: scale(1.05);
    color: white;
}

.apple-input {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid #2a2a35;
    background: #1c1c25;
    color: white;
    outline: none;
}

.apple-input:focus {
    border-color: var(--accent);
}

.section-title {
    font-weight: 500;
    margin-bottom: 20px;
}

.stat-number {
    font-size: 28px;
    font-weight: 600;
    color: var(--accent);
}
 .navbar-custom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 40px;
    background: rgba(15,23,42,0.9);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,0.05);
}

.nav-left {
    display: flex;
    align-items: center;
}

.brand-logo {
    font-size: 22px;
    font-weight: 600;
    color: #6366f1;
    text-decoration: none;
}

.nav-right {
    display: flex;
    align-items: center;
    gap: 18px;
}

.nav-btn {
    padding: 8px 16px;
    border-radius: 10px;
    text-decoration: none;
    color: #cbd5e1;
    border: 1px solid rgba(255,255,255,0.08);
    transition: 0.3s ease;
}

.nav-btn:hover {
    background: rgba(99,102,241,0.15);
    border: 1px solid #6366f1;
    color: white;
}

.active-nav {
    background: #6366f1;
    color: white !important;
    border: 1px solid #6366f1;
}

.logout-btn {
    padding: 8px 18px;
    border-radius: 10px;
    background: linear-gradient(135deg,#6366f1,#8b5cf6);
    color: white;
    text-decoration: none;
    font-weight: 500;
}

.profile-img {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #6366f1;
}

</style>
    
</head>

<body>

<nav class="navbar-custom">

    <!-- LEFT: App Name -->
    <div class="nav-left">
        <a href="{% url 'dashboard' %}" class="brand-logo">
            QuizPro🧩
        </a>
    </div>

    <!-- RIGHT: Navigation -->
    <div class="nav-right">

        {% if request.user.is_authenticated %}

            <a href="{% url 'dashboard' %}"
               class="nav-btn {% if request.path == '/dashboard/' %}active-nav{% endif %}">
                Dashboard
            </a>

            <a href="{% url 'leaderboard' %}"
               class="nav-btn {% if request.path == '/leaderboard/' %}active-nav{% endif %}">
                Leaderboard
            </a>

            <!-- Google Profile Photo -->
            {% if request.user.socialaccount_set.all %}
                {% with request.user.socialaccount_set.all.0.extra_data.picture as profile_pic %}
                    <img src="{{ profile_pic }}" class="profile-img">
                {% endwith %}
            {% endif %}

            <a href="{% url 'logout' %}" class="logout-btn">
                Logout
            </a>

        {% endif %}

    </div>

</nav>

<div class="container py-4">
    {% block content %}{% endblock %}
</div>
<script>
document.addEventListener("DOMContentLoaded", function() {

    const reveals = document.querySelectorAll(".card-modern");

    function revealOnScroll() {
        reveals.forEach(el => {
            const windowHeight = window.innerHeight;
            const elementTop = el.getBoundingClientRect().top;

            if (elementTop < windowHeight - 50) {
                el.style.opacity = 1;
                el.style.transform = "translateY(0)";
            }
        });
    }

    reveals.forEach(el => {
        el.style.opacity = 0;
        el.style.transform = "translateY(30px)";
        el.style.transition = "all 0.6s ease";
    });

    window.addEventListener("scroll", revealOnScroll);
    revealOnScroll();
});
</script>
</body>
</html>
