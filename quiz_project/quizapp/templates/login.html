{% extends 'base.html' %}
{% block content %}
{% load socialaccount %}
<div class="d-flex justify-content-center align-items-center" style="min-height:85vh;">

    <div class="card-modern" style="width:400px;">

        <h3 class="text-center mb-4">Login</h3>

        <form method="POST">
            {% csrf_token %}

            <input type="text" name="username"
                   class="apple-input mb-3"
                   placeholder="Username"
                   required>

            <input type="password" name="password"
                   class="apple-input mb-4"
                   placeholder="Password"
                   required>

            <button type="submit" class="btn btn-modern w-100">
                Login
            </button>
        </form>

        <div class="text-center mt-3">
            <a href="{% url 'register' %}" style="color:#9ca3af;">
                Don't have an account? Register
            </a>
        </div>

        <hr class="my-4" style="border-color:#2a2a35;">

        <a href="{% provider_login_url 'google' %}"
           class="btn btn-outline-light w-100">
            Continue with Google
        </a>

    </div>

</div>

{% endblock %}
